<script>
    (function () {
        if (window.cloverMarkdownEditorBound) {
            return;
        }
        window.cloverMarkdownEditorBound = true;

        function getPanelChild(panel, selector) {
            return panel ? panel.querySelector(selector) : null;
        }

        function getTextarea(panel) {
            var textareaId = panel.getAttribute('data-markdown-editor-for');
            return document.getElementById(textareaId);
        }

        function insertMarkdown(textarea, beforeText, selectedFallback, afterText) {
            var selectionStart = textarea.selectionStart || 0;
            var selectionEnd = textarea.selectionEnd || selectionStart;
            var currentValue = textarea.value;
            var selectedText = currentValue.slice(selectionStart, selectionEnd) || selectedFallback;
            var insertedText = beforeText + selectedText + afterText;
            textarea.value = currentValue.slice(0, selectionStart) + insertedText + currentValue.slice(selectionEnd);
            textarea.focus();
            textarea.setSelectionRange(
                selectionStart + beforeText.length,
                selectionStart + beforeText.length + selectedText.length
            );
        }

        function escapeMarkdownPreview(rawText) {
            return rawText
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function isSafePreviewLink(rawUrl) {
            if (rawUrl.indexOf('//') === 0) {
                return false;
            }
            try {
                var parsedUrl = new URL(rawUrl, window.location.origin);
                return ['http:', 'https:', 'mailto:'].indexOf(parsedUrl.protocol) !== -1
                    || (rawUrl.indexOf('/') === 0 && rawUrl.indexOf('//') !== 0);
            } catch (error) {
                return false;
            }
        }

        function isSafePreviewImage(rawUrl) {
            if (rawUrl.indexOf('//') === 0) {
                return false;
            }
            try {
                var parsedUrl = new URL(rawUrl, window.location.origin);
                return ['http:', 'https:'].indexOf(parsedUrl.protocol) !== -1
                    || rawUrl.indexOf('/media/') === 0;
            } catch (error) {
                return false;
            }
        }

        function renderInlineMarkdown(escapedText) {
            return escapedText
                .replace(/!\[([^\]\n]*)\]\(([^)\s]+)\)/g, function (fullMatch, imageAlt, imageUrl) {
                    return isSafePreviewImage(imageUrl)
                        ? '<img src="' + imageUrl + '" alt="' + imageAlt + '" loading="lazy">'
                        : fullMatch;
                })
                .replace(/\[([^\]\n]+)\]\(([^)\s]+)\)/g, function (fullMatch, linkText, linkUrl) {
                    return isSafePreviewLink(linkUrl)
                        ? '<a href="' + linkUrl + '">' + linkText + '</a>'
                        : fullMatch;
                })
                .replace(/\*\*([^\n]+?)\*\*/g, '<strong>$1</strong>');
        }

        function renderMarkdownPreview(rawText) {
            var escapedText = escapeMarkdownPreview(rawText || '').replace(/\r\n/g, '\n').replace(/\r/g, '\n');
            var blocks = escapedText.split(/\n{2,}/);
            return blocks.map(function (blockText) {
                var strippedBlock = blockText.replace(/^\n+|\n+$/g, '');
                if (!strippedBlock.trim()) {
                    return '';
                }
                var headingMatch = strippedBlock.match(/^(#{1,3})\s+(.+)$/);
                if (headingMatch && strippedBlock.indexOf('\n') === -1) {
                    var headingLevel = headingMatch[1].length + 1;
                    return '<h' + headingLevel + '>' + renderInlineMarkdown(headingMatch[2].trim()) + '</h' + headingLevel + '>';
                }
                return '<p>' + renderInlineMarkdown(strippedBlock).replace(/\n/g, '<br>') + '</p>';
            }).filter(Boolean).join('\n\n');
        }

        document.addEventListener('click', function (event) {
            var actionButton = event.target.closest('[data-markdown-action]');
            if (!actionButton) {
                return;
            }

            var panel = actionButton.closest('[data-markdown-editor-for]');
            var textarea = getTextarea(panel);
            var action = actionButton.getAttribute('data-markdown-action');
            var preview = getPanelChild(panel, '[data-markdown-preview]');
            if (!textarea) {
                return;
            }

            if (action === 'heading') {
                insertMarkdown(textarea, '## ', '小标题', '');
            } else if (action === 'bold') {
                insertMarkdown(textarea, '**', '加粗文字', '**');
            } else if (action === 'link') {
                insertMarkdown(textarea, '[', '链接文字', '](https://example.com)');
            } else if (action === 'image-url') {
                insertMarkdown(textarea, '![', '图片说明', '](https://example.com/image.jpg)');
            } else if (action === 'preview' && preview) {
                preview.innerHTML = renderMarkdownPreview(textarea.value);
                preview.classList.toggle('d-none');
            }
        });

        document.addEventListener('change', function (event) {
            var uploadInput = event.target.closest('[data-markdown-image-upload]');
            if (!uploadInput || !uploadInput.files || !uploadInput.files.length) {
                return;
            }

            var panel = uploadInput.closest('[data-markdown-editor-for]');
            var textarea = getTextarea(panel);
            var status = getPanelChild(panel, '[data-markdown-status]');
            var uploadUrl = panel.getAttribute('data-markdown-upload-url');
            var csrfInput = document.querySelector('input[name="csrfmiddlewaretoken"]');
            var formData = new FormData();
            formData.append('image', uploadInput.files[0]);
            if (status) {
                status.textContent = '图片上传中...';
            }

            fetch(uploadUrl, {
                method: 'POST',
                body: formData,
                credentials: 'same-origin',
                headers: {
                    'X-CSRFToken': csrfInput ? csrfInput.value : '',
                },
            })
                .then(function (response) {
                    return response.json().then(function (responseData) {
                        if (!response.ok) {
                            throw new Error(responseData.error || '图片上传失败。');
                        }
                        return responseData;
                    });
                })
                .then(function (responseData) {
                    if (textarea) {
                        insertMarkdown(textarea, '![', uploadInput.files[0].name.replace(/\.[^.]+$/, ''), '](' + responseData.url + ')');
                    }
                    if (status) {
                        status.textContent = '图片已插入正文。';
                    }
                })
                .catch(function (error) {
                    if (status) {
                        status.textContent = error.message;
                    }
                })
                .finally(function () {
                    uploadInput.value = '';
                });
        });
    })();
</script>
