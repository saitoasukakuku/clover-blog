<script>
    (function () {
        if (window.cloverMarkdownEditorController && typeof window.cloverMarkdownEditorController.destroy === 'function') {
            window.cloverMarkdownEditorController.destroy();
        }

        var MAX_MARKDOWN_HISTORY_STATES = 80;

        function closestElement(target, selector) {
            return target && target.closest ? target.closest(selector) : null;
        }

        function getSourceTextarea(modal) {
            var textareaId = modal ? modal.getAttribute('data-markdown-modal-for') : '';
            return textareaId ? document.getElementById(textareaId) : null;
        }

        function getModalTextarea(modal) {
            return modal ? modal.querySelector('[data-markdown-modal-textarea]') : null;
        }

        function getPreview(modal) {
            return modal ? modal.querySelector('[data-markdown-preview]') : null;
        }

        function getStatus(modal) {
            return modal ? modal.querySelector('[data-markdown-status]') : null;
        }

        function setStatus(modal, message, isError) {
            var status = getStatus(modal);
            if (!status) {
                return;
            }
            status.textContent = message || '';
            status.classList.toggle('is-error', Boolean(isError));
        }

        function saveSelection(textarea) {
            if (!textarea || typeof textarea.selectionStart !== 'number') {
                return;
            }
            textarea.dataset.markdownSelectionStart = String(textarea.selectionStart);
            textarea.dataset.markdownSelectionEnd = String(textarea.selectionEnd);
            textarea.dataset.markdownScrollTop = String(textarea.scrollTop || 0);
            updateCurrentMarkdownHistorySelection(textarea);
        }

        function getSavedSelection(textarea) {
            var selectionStart = parseInt(textarea.dataset.markdownSelectionStart || '', 10);
            var selectionEnd = parseInt(textarea.dataset.markdownSelectionEnd || '', 10);
            if (Number.isNaN(selectionStart) || Number.isNaN(selectionEnd)) {
                selectionStart = typeof textarea.selectionStart === 'number' ? textarea.selectionStart : textarea.value.length;
                selectionEnd = typeof textarea.selectionEnd === 'number' ? textarea.selectionEnd : selectionStart;
            }
            selectionStart = Math.max(0, Math.min(selectionStart, textarea.value.length));
            selectionEnd = Math.max(selectionStart, Math.min(selectionEnd, textarea.value.length));
            return { start: selectionStart, end: selectionEnd };
        }

        function getSavedScrollTop(textarea) {
            var savedScrollTop = parseInt(textarea.dataset.markdownScrollTop || '', 10);
            if (Number.isNaN(savedScrollTop)) {
                return textarea.scrollTop || 0;
            }
            return Math.max(0, savedScrollTop);
        }

        function focusTextareaWithoutPageJump(textarea) {
            try {
                textarea.focus({ preventScroll: true });
            } catch (error) {
                textarea.focus();
            }
        }

        function restoreTextareaScroll(textarea, scrollTop) {
            textarea.scrollTop = scrollTop;
            textarea.dataset.markdownScrollTop = String(scrollTop);
            window.requestAnimationFrame(function () {
                textarea.scrollTop = scrollTop;
                textarea.dataset.markdownScrollTop = String(scrollTop);
            });
        }

        function getMarkdownHistoryState(textarea) {
            return {
                value: textarea.value,
                selectionStart: typeof textarea.selectionStart === 'number' ? textarea.selectionStart : textarea.value.length,
                selectionEnd: typeof textarea.selectionEnd === 'number' ? textarea.selectionEnd : textarea.value.length,
                scrollTop: textarea.scrollTop || 0,
            };
        }

        function updateCurrentMarkdownHistorySelection(textarea) {
            var undoStack = textarea ? textarea._markdownUndoStack : null;
            if (!undoStack || !undoStack.length) {
                return;
            }
            var currentState = getMarkdownHistoryState(textarea);
            var latestState = undoStack[undoStack.length - 1];
            if (latestState.value !== currentState.value) {
                return;
            }
            latestState.selectionStart = currentState.selectionStart;
            latestState.selectionEnd = currentState.selectionEnd;
            latestState.scrollTop = currentState.scrollTop;
        }

        function initializeMarkdownHistory(textarea) {
            textarea._markdownUndoStack = [getMarkdownHistoryState(textarea)];
            textarea._markdownRedoStack = [];
        }

        function recordMarkdownHistory(textarea) {
            if (!textarea || textarea.dataset.markdownHistoryRestoring === 'true') {
                return;
            }
            if (!textarea._markdownUndoStack) {
                initializeMarkdownHistory(textarea);
                return;
            }

            var currentState = getMarkdownHistoryState(textarea);
            var undoStack = textarea._markdownUndoStack;
            var latestState = undoStack[undoStack.length - 1];
            if (latestState && latestState.value === currentState.value) {
                undoStack[undoStack.length - 1] = currentState;
                return;
            }

            undoStack.push(currentState);
            if (undoStack.length > MAX_MARKDOWN_HISTORY_STATES) {
                undoStack.shift();
            }
            textarea._markdownRedoStack = [];
        }

        function restoreMarkdownHistoryState(textarea, modal, historyState) {
            textarea.dataset.markdownHistoryRestoring = 'true';
            textarea.value = historyState.value;
            focusTextareaWithoutPageJump(textarea);
            textarea.setSelectionRange(
                Math.max(0, Math.min(historyState.selectionStart, textarea.value.length)),
                Math.max(0, Math.min(historyState.selectionEnd, textarea.value.length))
            );
            restoreTextareaScroll(textarea, historyState.scrollTop);
            saveSelection(textarea);
            syncSourceFromModal(modal);
            updatePreview(modal);
            delete textarea.dataset.markdownHistoryRestoring;
        }

        function undoMarkdownHistory(textarea, modal) {
            var undoStack = textarea._markdownUndoStack || [];
            if (undoStack.length < 2) {
                return false;
            }

            var currentState = undoStack.pop();
            textarea._markdownRedoStack = textarea._markdownRedoStack || [];
            textarea._markdownRedoStack.push(currentState);
            restoreMarkdownHistoryState(textarea, modal, undoStack[undoStack.length - 1]);
            return true;
        }

        function redoMarkdownHistory(textarea, modal) {
            var redoStack = textarea._markdownRedoStack || [];
            if (!redoStack.length) {
                return false;
            }

            var nextState = redoStack.pop();
            textarea._markdownUndoStack = textarea._markdownUndoStack || [];
            textarea._markdownUndoStack.push(nextState);
            restoreMarkdownHistoryState(textarea, modal, nextState);
            return true;
        }

        function dispatchTextareaInput(textarea) {
            textarea.dispatchEvent(new Event('input', { bubbles: true }));
        }

        function insertMarkdown(textarea, beforeText, selectedFallback, afterText) {
            var selection = getSavedSelection(textarea);
            var savedScrollTop = getSavedScrollTop(textarea);
            var currentValue = textarea.value;
            var selectedText = currentValue.slice(selection.start, selection.end) || selectedFallback;
            var insertedText = beforeText + selectedText + afterText;
            textarea.value = currentValue.slice(0, selection.start) + insertedText + currentValue.slice(selection.end);
            focusTextareaWithoutPageJump(textarea);
            textarea.setSelectionRange(
                selection.start + beforeText.length,
                selection.start + beforeText.length + selectedText.length
            );
            restoreTextareaScroll(textarea, savedScrollTop);
            saveSelection(textarea);
            dispatchTextareaInput(textarea);
            restoreTextareaScroll(textarea, savedScrollTop);
        }

        function insertMarkdownBlock(textarea, markdownText) {
            var selection = getSavedSelection(textarea);
            var savedScrollTop = getSavedScrollTop(textarea);
            var currentValue = textarea.value;
            var needsLeadingNewline = selection.start > 0 && currentValue.charAt(selection.start - 1) !== '\n';
            var needsTrailingNewline = selection.end < currentValue.length && currentValue.charAt(selection.end) !== '\n';
            var insertedText = (needsLeadingNewline ? '\n' : '') + markdownText + (needsTrailingNewline ? '\n' : '');
            textarea.value = currentValue.slice(0, selection.start) + insertedText + currentValue.slice(selection.end);
            var cursorPosition = selection.start + insertedText.length;
            focusTextareaWithoutPageJump(textarea);
            textarea.setSelectionRange(cursorPosition, cursorPosition);
            restoreTextareaScroll(textarea, savedScrollTop);
            saveSelection(textarea);
            dispatchTextareaInput(textarea);
            restoreTextareaScroll(textarea, savedScrollTop);
        }

        function promptMarkdownImageUrl() {
            var imageUrl = window.prompt('请输入图片地址');
            if (!imageUrl) {
                return '';
            }
            return imageUrl.trim();
        }

        function escapeMarkdownPreview(rawText) {
            return rawText
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function isSafePreviewLink(rawUrl) {
            if (rawUrl.indexOf('//') === 0) {
                return false;
            }
            try {
                var parsedUrl = new URL(rawUrl, window.location.origin);
                return ['http:', 'https:', 'mailto:'].indexOf(parsedUrl.protocol) !== -1
                    || (rawUrl.indexOf('/') === 0 && rawUrl.indexOf('//') !== 0);
            } catch (error) {
                return false;
            }
        }

        function isSafePreviewImage(rawUrl) {
            if (rawUrl.indexOf('//') === 0) {
                return false;
            }
            try {
                var parsedUrl = new URL(rawUrl, window.location.origin);
                return ['http:', 'https:'].indexOf(parsedUrl.protocol) !== -1
                    || rawUrl.indexOf('/media/') === 0;
            } catch (error) {
                return false;
            }
        }

        function renderInlineMarkdown(escapedText) {
            return escapedText
                .replace(/!\[([^\]\n]*)\]\(([^)\s]+)\)/g, function (fullMatch, imageAlt, imageUrl) {
                    return isSafePreviewImage(imageUrl)
                        ? '<img src="' + imageUrl + '" alt="' + imageAlt + '" loading="lazy">'
                        : fullMatch;
                })
                .replace(/\[([^\]\n]+)\]\(([^)\s]+)\)/g, function (fullMatch, linkText, linkUrl) {
                    return isSafePreviewLink(linkUrl)
                        ? '<a href="' + linkUrl + '">' + linkText + '</a>'
                        : fullMatch;
                })
                .replace(/\*\*([^\n]+?)\*\*/g, '<strong>$1</strong>');
        }

        function renderMarkdownLines(escapedLines) {
            var renderedBlocks = [];
            var pendingParagraphLines = [];

            function flushPendingParagraph() {
                if (!pendingParagraphLines.length) {
                    return;
                }
                var paragraphText = pendingParagraphLines.join('\n').replace(/^\n+|\n+$/g, '');
                if (paragraphText.trim()) {
                    renderedBlocks.push('<p>' + renderInlineMarkdown(paragraphText).replace(/\n/g, '<br>') + '</p>');
                }
                pendingParagraphLines = [];
            }

            escapedLines.forEach(function (escapedLine) {
                var headingMatch = escapedLine.trim().match(/^(#{1,3})\s+(.+)$/);
                if (headingMatch) {
                    flushPendingParagraph();
                    var headingLevel = headingMatch[1].length + 1;
                    renderedBlocks.push(
                        '<h' + headingLevel + '>' + renderInlineMarkdown(headingMatch[2].trim()) + '</h' + headingLevel + '>'
                    );
                    return;
                }

                if (!escapedLine.trim()) {
                    flushPendingParagraph();
                    return;
                }

                pendingParagraphLines.push(escapedLine);
            });

            flushPendingParagraph();
            return renderedBlocks;
        }

        function renderMarkdownPreview(rawText) {
            var escapedText = escapeMarkdownPreview(rawText || '').replace(/\r\n/g, '\n').replace(/\r/g, '\n');
            return renderMarkdownLines(escapedText.split('\n')).join('\n\n');
        }

        function updatePreview(modal) {
            var textarea = getModalTextarea(modal);
            var preview = getPreview(modal);
            if (textarea && preview) {
                var previewScrollTop = preview.scrollTop || 0;
                preview.innerHTML = renderMarkdownPreview(textarea.value);
                preview.scrollTop = previewScrollTop;
            }
        }

        function syncModalFromSource(modal) {
            var sourceTextarea = getSourceTextarea(modal);
            var modalTextarea = getModalTextarea(modal);
            if (!sourceTextarea || !modalTextarea) {
                return;
            }
            modalTextarea.value = sourceTextarea.value;
            saveSelection(modalTextarea);
            initializeMarkdownHistory(modalTextarea);
            setStatus(modal, '', false);
            updatePreview(modal);
        }

        function syncSourceFromModal(modal) {
            var sourceTextarea = getSourceTextarea(modal);
            var modalTextarea = getModalTextarea(modal);
            if (!sourceTextarea || !modalTextarea) {
                return;
            }
            sourceTextarea.value = modalTextarea.value;
            sourceTextarea.dispatchEvent(new Event('input', { bubbles: true }));
        }

        function handleClick(event) {
            var launcher = closestElement(event.target, '[data-markdown-launcher-for]');
            if (launcher) {
                var modalId = launcher.getAttribute('data-bs-target');
                var modal = modalId ? document.querySelector(modalId) : null;
                if (modal) {
                    syncModalFromSource(modal);
                }
                return;
            }

            var imageTrigger = closestElement(event.target, '[data-markdown-image-trigger]');
            if (imageTrigger) {
                var triggerModal = closestElement(imageTrigger, '[data-markdown-modal-for]');
                var triggerTextarea = getModalTextarea(triggerModal);
                if (triggerTextarea) {
                    saveSelection(triggerTextarea);
                }
                setStatus(triggerModal, '请选择要插入正文的图片。', false);
                return;
            }

            var actionButton = closestElement(event.target, '[data-markdown-action]');
            if (!actionButton) {
                return;
            }

            var modal = closestElement(actionButton, '[data-markdown-modal-for]');
            var textarea = getModalTextarea(modal);
            var action = actionButton.getAttribute('data-markdown-action');
            if (!textarea) {
                return;
            }

            event.preventDefault();
            saveSelection(textarea);

            if (action === 'heading') {
                insertMarkdown(textarea, '## ', '小标题', '');
            } else if (action === 'bold') {
                insertMarkdown(textarea, '**', '加粗文字', '**');
            } else if (action === 'link') {
                insertMarkdown(textarea, '[', '链接文字', '](https://example.com)');
            } else if (action === 'image-url') {
                var imageUrl = promptMarkdownImageUrl();
                if (imageUrl) {
                    insertMarkdownBlock(textarea, '![图片说明](' + imageUrl + ')');
                }
            } else if (action === 'preview') {
                var previewPane = modal ? modal.querySelector('[data-markdown-preview-pane]') : null;
                if (previewPane) {
                    previewPane.classList.toggle('d-none');
                    actionButton.classList.toggle('is-active', !previewPane.classList.contains('d-none'));
                }
                updatePreview(modal);
            }
        }

        function handleInput(event) {
            var textarea = closestElement(event.target, '[data-markdown-modal-textarea]');
            if (!textarea) {
                return;
            }
            var modal = closestElement(textarea, '[data-markdown-modal-for]');
            saveSelection(textarea);
            recordMarkdownHistory(textarea);
            syncSourceFromModal(modal);
            updatePreview(modal);
        }

        function handleKeydown(event) {
            var textarea = closestElement(event.target, '[data-markdown-modal-textarea]');
            if (!textarea || (!event.ctrlKey && !event.metaKey)) {
                return;
            }

            var keyName = event.key ? event.key.toLowerCase() : '';
            var modal = closestElement(textarea, '[data-markdown-modal-for]');
            if (keyName === 'z' && event.shiftKey) {
                event.preventDefault();
                redoMarkdownHistory(textarea, modal);
                return;
            }
            if (keyName === 'z') {
                event.preventDefault();
                undoMarkdownHistory(textarea, modal);
                return;
            }
            if (keyName === 'y') {
                event.preventDefault();
                redoMarkdownHistory(textarea, modal);
            }
        }

        function handleSelectionEvent(event) {
            var textarea = closestElement(event.target, '[data-markdown-modal-textarea]');
            if (textarea) {
                saveSelection(textarea);
            }
        }

        function buildCompressedImageName(fileName) {
            var baseName = (fileName || 'image').replace(/\.[^.]+$/, '').replace(/[\\/:*?"<>|]+/g, '-').trim() || 'image';
            return baseName + '.jpg';
        }

        function compressMarkdownImage(imageFile) {
            var maxImageEdge = 1600;
            var jpegQuality = 0.82;
            var skipCompressionBytes = 700 * 1024;

            if (!imageFile || imageFile.size <= skipCompressionBytes || !/^image\//.test(imageFile.type) || imageFile.type === 'image/gif') {
                return Promise.resolve(imageFile);
            }

            if (!window.FileReader || !window.Image || !document.createElement('canvas').toBlob) {
                return Promise.resolve(imageFile);
            }

            return new Promise(function (resolve) {
                var reader = new FileReader();
                reader.onload = function () {
                    var image = new Image();
                    image.onload = function () {
                        var width = image.naturalWidth || image.width;
                        var height = image.naturalHeight || image.height;
                        var scale = Math.min(1, maxImageEdge / Math.max(width, height));
                        var targetWidth = Math.max(1, Math.round(width * scale));
                        var targetHeight = Math.max(1, Math.round(height * scale));
                        var canvas = document.createElement('canvas');
                        var context = canvas.getContext('2d');

                        if (!context) {
                            resolve(imageFile);
                            return;
                        }

                        canvas.width = targetWidth;
                        canvas.height = targetHeight;
                        context.fillStyle = '#ffffff';
                        context.fillRect(0, 0, targetWidth, targetHeight);
                        context.drawImage(image, 0, 0, targetWidth, targetHeight);
                        canvas.toBlob(function (imageBlob) {
                            if (!imageBlob || imageBlob.size >= imageFile.size) {
                                resolve(imageFile);
                                return;
                            }
                            resolve(new File([imageBlob], buildCompressedImageName(imageFile.name), {
                                type: 'image/jpeg',
                                lastModified: Date.now(),
                            }));
                        }, 'image/jpeg', jpegQuality);
                    };
                    image.onerror = function () {
                        resolve(imageFile);
                    };
                    image.src = reader.result;
                };
                reader.onerror = function () {
                    resolve(imageFile);
                };
                reader.readAsDataURL(imageFile);
            });
        }

        function uploadMarkdownImageFile(modal, textarea, originalImageFile, statusText) {
            var uploadUrl = modal ? modal.getAttribute('data-markdown-upload-url') : '';
            var csrfInput = document.querySelector('input[name="csrfmiddlewaretoken"]');

            if (!textarea || !uploadUrl || !originalImageFile) {
                return Promise.resolve();
            }

            setStatus(modal, statusText || '正在压缩图片...', false);

            return compressMarkdownImage(originalImageFile)
                .then(function (imageFileForUpload) {
                    var formData = new FormData();
                    formData.append('image', imageFileForUpload);
                    if (imageFileForUpload.size < originalImageFile.size) {
                        setStatus(modal, '图片已压缩，正在上传...', false);
                    } else {
                        setStatus(modal, '图片上传中...', false);
                    }

                    return fetch(uploadUrl, {
                        method: 'POST',
                        body: formData,
                        credentials: 'same-origin',
                        headers: {
                            'X-CSRFToken': csrfInput ? csrfInput.value : '',
                        },
                    });
                })
                .then(function (response) {
                    return response.json().then(function (responseData) {
                        if (!response.ok) {
                            throw new Error(responseData.error || '图片上传失败。');
                        }
                        return responseData;
                    });
                })
                .then(function (responseData) {
                    var fallbackAltText = (originalImageFile.name || '图片').replace(/\.[^.]+$/, '');
                    var insertedMarkdown = responseData.markdown || ('![' + fallbackAltText + '](' + responseData.url + ')');
                    insertMarkdownBlock(textarea, insertedMarkdown);
                    setStatus(modal, '图片已插入正文。', false);
                })
                .catch(function (error) {
                    setStatus(modal, error.message, true);
                });
        }

        function handleUploadChange(event) {
            var uploadInput = closestElement(event.target, '[data-markdown-image-upload]');
            if (!uploadInput || !uploadInput.files || !uploadInput.files.length) {
                return;
            }

            var modal = closestElement(uploadInput, '[data-markdown-modal-for]');
            var textarea = getModalTextarea(modal);
            var originalImageFile = uploadInput.files[0];

            if (!textarea) {
                uploadInput.value = '';
                return;
            }

            uploadMarkdownImageFile(modal, textarea, originalImageFile, '正在压缩图片...')
                .finally(function () {
                    uploadInput.value = '';
                });
        }

        function findPastedImageFile(clipboardData) {
            if (!clipboardData || !clipboardData.items) {
                return null;
            }
            for (var itemIndex = 0; itemIndex < clipboardData.items.length; itemIndex += 1) {
                var clipboardItem = clipboardData.items[itemIndex];
                if (clipboardItem.kind === 'file' && /^image\//.test(clipboardItem.type)) {
                    return clipboardItem.getAsFile();
                }
            }
            return null;
        }

        function handlePaste(event) {
            var textarea = closestElement(event.target, '[data-markdown-modal-textarea]');
            if (!textarea) {
                return;
            }

            var pastedImageFile = findPastedImageFile(event.clipboardData);
            if (!pastedImageFile) {
                return;
            }

            event.preventDefault();
            var modal = closestElement(textarea, '[data-markdown-modal-for]');
            saveSelection(textarea);
            uploadMarkdownImageFile(modal, textarea, pastedImageFile, '粘贴图片上传中...');
        }

        function handleShownModal(event) {
            var modal = closestElement(event.target, '[data-markdown-modal-for]');
            var textarea = getModalTextarea(modal);
            if (textarea) {
                textarea.focus();
                saveSelection(textarea);
            }
        }

        document.addEventListener('click', handleClick);
        document.addEventListener('keydown', handleKeydown);
        document.addEventListener('input', handleInput);
        document.addEventListener('change', handleUploadChange);
        document.addEventListener('paste', handlePaste);
        document.addEventListener('keyup', handleSelectionEvent);
        document.addEventListener('mouseup', handleSelectionEvent);
        document.addEventListener('select', handleSelectionEvent);
        document.addEventListener('shown.bs.modal', handleShownModal);

        window.cloverMarkdownEditorController = {
            destroy: function () {
                document.removeEventListener('click', handleClick);
                document.removeEventListener('keydown', handleKeydown);
                document.removeEventListener('input', handleInput);
                document.removeEventListener('change', handleUploadChange);
                document.removeEventListener('paste', handlePaste);
                document.removeEventListener('keyup', handleSelectionEvent);
                document.removeEventListener('mouseup', handleSelectionEvent);
                document.removeEventListener('select', handleSelectionEvent);
                document.removeEventListener('shown.bs.modal', handleShownModal);
            }
        };
    })();
</script>
